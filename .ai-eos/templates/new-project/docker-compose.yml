# <APP_TITLE>
# Runs unchanged on the NAS and on a cloud instance. Only .env differs.
# No `ports:` anywhere. The shared ingress routes by label (ADR-022).

services:

  <APP>-db:
    image: postgres:16
    container_name: <APP>-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks: [<APP>-net]          # private only — never on edge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  <APP>-backend:
    build: ./backend
    container_name: <APP>-backend
    restart: always
    depends_on:
      <APP>-db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@<APP>-db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ISSUER: ${AUTH_ISSUER}
      PLATFORM_VERSION: ${PLATFORM_VERSION}
      TZ: ${TZ}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks: [<APP>-net]

  <APP>-backup:
    image: platform/backup:${PLATFORM_VERSION}   # shared image, isolated instance
    container_name: <APP>-backup
    restart: always
    depends_on:
      <APP>-db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@<APP>-db:5432/${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      TZ: ${TZ}
    volumes:
      - ./backups:/backups
      - ./uploads:/uploads:ro
    networks: [<APP>-net]

  <APP>-frontend:
    image: nginx:alpine
    container_name: <APP>-frontend
    restart: always
    depends_on: [<APP>-backend]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [<APP>-net, edge]
    labels:
      - "app.route.host=${APP_DOMAIN}"
      - "app.route.port=80"
      - "app.route.tls=true"

networks:
  <APP>-net:
    driver: bridge
  edge:
    external: true          # created once per host by the platform ingress
